services:
  - type: web
    name: merry-team
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DB_PATH
        value: /data/attendance.db
    disk:
      name: merry-team-data
      mountPath: /data
      sizeGB: 1
